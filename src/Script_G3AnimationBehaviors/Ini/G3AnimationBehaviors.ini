; G3AnimationBehaviors — active Speed profiles (ADR-0011)
;
; One [Profile.*] section represents one resolved animation set. The section
; label is for authors; only these explicit identity fields determine matching:
;   AnimationFamily = Animation.GetSkeletonName(...)
;   LeftAnimationToken / RightAnimationToken = fields 2 / 3 (zero-based) of
;     Entity.GetAni(factualAction, factualPhase): Family_State_Left_Right_...
; Identity matching ignores case and outer whitespace. Raw inventory UseType
; and the current/outgoing movement animation do not select Speed profiles.
;
; Factual action independently selects Normal, Quick, Power, Pierce, Hack,
; SimpleWhirl or Whirl. Shared resolved assets share a profile; separated
; request tokens select independent profiles without mod-name detection.
; Sprint has no separate key and inherits Power on the proven shared route.
; Finishing has no Speed profile. Human native Fist Quick is intentionally absent.
;
; <Attack>_ReferenceHitBaseSpeed = native Gothic Hit base B for the exact route.
; New Balance/another modified live result is not B. Compatible speed = B * M;
; <Attack>_BaseSpeed = authored base C; configured speed = compatible * (C / B).
; All active authored defaults below use C=1.00. Missing/invalid calibration,
; missing BaseSpeed, unresolved/malformed identity or no profile match leaves
; live compatible speed unchanged. BaseSpeed=1.00 is an explicit intervention.
; <Attack>_RaiseOverride is reserved for later Raise work and omitted here;
; Raise behavior remains inactive. Reference calibration: EV-396–EV-406.

[Profile.Hero_None_1H]
AnimationFamily=Hero
LeftAnimationToken=None
RightAnimationToken=1H

Normal_ReferenceHitBaseSpeed=0.60
Normal_BaseSpeed=1.00

Quick_ReferenceHitBaseSpeed=1.00
Quick_BaseSpeed=1.00

