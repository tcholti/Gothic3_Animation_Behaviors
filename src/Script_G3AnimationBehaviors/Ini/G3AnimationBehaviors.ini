; G3AnimationBehaviors behavior profiles
;
; Profile identity is defined by the four explicit identity fields. The text
; after "Profile." is only an author-facing label. Uncomment and adjust a
; complete section to configure it.
;
; ReferenceHitBaseSpeed=<positive finite float>
;   Factual native/compatible Hit reference base for this exact profile.
;   Speed override is inactive if this value is missing or invalid.
;
; BaseSpeed=<positive finite float>
;   Desired authored playback base. Missing BaseSpeed preserves native/
;   compatible speed behavior. BaseSpeed=1.00 is an explicit configured value.
;
; ReferenceRaiseBaseSpeed=<positive finite float>
;   Reserved factual Raise reference base for the later Raise feature.
;
; RaiseOverride=Off|On
;   Off/missing means G3AB does not own a custom Raise for this profile.
;   On is reserved for the later Raise feature and currently causes no Raise
;   intervention while Speed remains the active feature.

; [Profile.Hero_None_1H_Normal]
; AnimationFamily=Hero
; LeftAnimationUseType=None
; RightAnimationUseType=1H
; ActionProfile=Normal
; ReferenceHitBaseSpeed=0.60
; BaseSpeed=0.80
; RaiseOverride=Off

; [Profile.Hero_None_1H_Quick]
; AnimationFamily=Hero
; LeftAnimationUseType=None
; RightAnimationUseType=1H
; ActionProfile=Quick
; ReferenceHitBaseSpeed=1.00
; BaseSpeed=1.00
; RaiseOverride=Off

; Future Raise-enabled example. Raise behavior is not active yet.
; [Profile.Hero_None_2H_Normal]
; AnimationFamily=Hero
; LeftAnimationUseType=None
; RightAnimationUseType=2H
; ActionProfile=Normal
; ReferenceHitBaseSpeed=0.70
; ReferenceRaiseBaseSpeed=1.00
; BaseSpeed=0.80
; RaiseOverride=On
