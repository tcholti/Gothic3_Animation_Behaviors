; G3 Animation Behaviors - Attack Behavior Settings
;------------------------------------------------------------
; DEFAULT BEHAVIOR
;------------------------------------------------------------
; Installing this mod does not change attack speed or movement by default.
; In every profile below, BaseSpeed starts at the same value as
; ReferenceHitBaseSpeed.
;------------------------------------------------------------
; HOW TO CHANGE ATTACK SPEED
;------------------------------------------------------------
; 1. Find the weapon or animation type you want to change.
; 2. Find the attack type: Normal, Quick, Power, etc.
; 3. Change only BaseSpeed.
;
; Higher BaseSpeed = faster attack.
; Lower BaseSpeed  = slower attack.
;
; Example:
; If Normal_BaseSpeed is 0.60, changing it to 0.80 makes that attack faster.
; Changing it to 0.50 makes that attack slower.
;------------------------------------------------------------
; IMPORTANT
;------------------------------------------------------------
; Normally, do not change ReferenceHitBaseSpeed.
; It is Gothic's measured reference speed for that animation set.
; G3 Animation Behaviors uses it to calculate speed correctly and to keep
; compatible speed changes from the game or other mods.
;
; Only attack types with tested reference speeds are listed.
; If an attack type is missing from a profile, do not guess its reference speed.
; A missing profile or missing attack setting leaves the current game/mod speed alone.
;------------------------------------------------------------
; HOW TO CHANGE ATTACK MOVEMENT
;------------------------------------------------------------
; MovementOverride controls how far the character moves forward during an attack.
;
; 1. Find the weapon or animation type you want to change.
; 2. Find the attack type: Normal, Quick, Power, etc.
; 3. Change MovementOverride.
;
; Off = keep the normal Gothic / New Balance movement.
; 0   = no forward movement.
; Higher number = move farther forward.
;
; Example:
; Power_MovementOverride=0
; Power_MovementOverride=100
; Power_MovementOverride=300
;
; NOTE
; Gothic can still stop the character at obstacles, ledges, or the target.
; Sprint uses the Power_MovementOverride setting.
;------------------------------------------------------------
; ADDING A NEW ANIMATION PROFILE
;------------------------------------------------------------
; Profiles are built from the animation name.
;
; Example animation:
; Hero_Stand_None_2H_P0_Attack_Hit_N_Fwd_00_%_00_P0_0.xmot
;
; The important parts are:
; Hero = AnimationFamily
; None = LeftAnimationToken
; 2H   = RightAnimationToken
;
; This gives:
;
; [Profile.Hero_None_2H]
; AnimationFamily=Hero
; LeftAnimationToken=None
; RightAnimationToken=2H
;
; You can add a new profile in the same way when a mod introduces a new
; animation set. Add only attack types whose correct ReferenceHitBaseSpeed
; is known.
;
; Extra profiles are safe to leave in this file. They only apply when Gothic
; actually uses a matching animation set.

; ============================================================
; STANDARD HERO WEAPONS
; ============================================================

; ------------------------------------------------------------
; 1H - ONE-HANDED WEAPONS
; ------------------------------------------------------------
[Profile.Hero_None_1H]
AnimationFamily=Hero
LeftAnimationToken=None
RightAnimationToken=1H

Normal_ReferenceHitBaseSpeed=0.60
Normal_BaseSpeed=0.60
Normal_AddRaise=Off
Normal_MovementOverride=Off

Quick_ReferenceHitBaseSpeed=1.00
Quick_BaseSpeed=1.00
Quick_AddRaise=Off
Quick_MovementOverride=Off

Power_ReferenceHitBaseSpeed=1.00
Power_BaseSpeed=1.00
Power_MovementOverride=Off

Pierce_ReferenceHitBaseSpeed=1.00
Pierce_BaseSpeed=1.00
Pierce_MovementOverride=Off

