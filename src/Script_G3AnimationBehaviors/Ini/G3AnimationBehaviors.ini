; G3AnimationBehaviors behavior profiles
;
; One [Profile.*] section represents one animation-family/loadout identity.
; The text after "Profile." is only an author-facing label; runtime identity
; comes from the three explicit fields below.
;
; AnimationFamily=<Gothic animation family, e.g. Hero>
; LeftAnimationUseType=<normalized animation use type>
; RightAnimationUseType=<normalized animation use type>
;
; Each attack is configured independently inside that loadout using:
;
; <Attack>_ReferenceHitBaseSpeed=<positive finite float>
;   Factual native Gothic Hit base B for that exact attack/loadout route.
;   Compatible live result = B * M; configured result = C * M.
;   New Balance/another compatibility-modified live value is NOT native B.
;   Speed intervention is inactive for that attack if this value is
;   missing or invalid.
;
; <Attack>_BaseSpeed=<positive finite float>
;   Desired authored playback base C. Missing BaseSpeed leaves the live
;   Gothic/compatible speed unchanged. BaseSpeed=1.00 is an explicit value.
;
; <Attack>_RaiseOverride=Off|On
;   Reserved for the later Raise feature. Off/missing means G3AB does not
;   request a custom Raise. On is parsed/stored now but causes no Raise
;   behavior while Speed remains the active feature.
;
; Supported Speed attack prefixes in this version:
;   Normal, Quick, Power, Pierce, Hack, SimpleWhirl, Whirl
;
; Sprint has no separate Speed profile/key. On the proven shared route it
; uses the Power profile (docs/decisions/ADR-0009-sprint-inherits-power-speed-profile.md).
; Unsupported/unconfigured attacks preserve the live compatible behavior.
;
; Raise does not have a separate authored speed setting. When Raise is later
; implemented, the first test is whether it naturally follows the attack's
; BaseSpeed; extra Raise-speed code/configuration will be added only if runtime
; evidence proves it necessary.

; Example grouped loadout. Uncomment only the attacks you want to configure.
; EV-396 establishes native Hero None+1H Normal/Quick/Power Hit references below.
; Pierce/Hack/SimpleWhirl/Whirl reference values below are provisional examples,
; not established native calibration facts; verify the exact route before use.
;
; [Profile.Hero_None_1H]
; AnimationFamily=Hero
; LeftAnimationUseType=None
; RightAnimationUseType=1H
;
; Normal_ReferenceHitBaseSpeed=0.60
; Normal_BaseSpeed=1.00
; Normal_RaiseOverride=On
;
; Quick_ReferenceHitBaseSpeed=1.00
; Quick_BaseSpeed=1.00
; Quick_RaiseOverride=On
;
; Power_ReferenceHitBaseSpeed=1.00
; Power_BaseSpeed=1.00
; Power_RaiseOverride=Off
;
; Pierce_ReferenceHitBaseSpeed=1.00
; Pierce_BaseSpeed=1.00
; Pierce_RaiseOverride=Off
;
; Hack_ReferenceHitBaseSpeed=1.00
; Hack_BaseSpeed=1.00
; Hack_RaiseOverride=Off
;
; SimpleWhirl_ReferenceHitBaseSpeed=1.30
; SimpleWhirl_BaseSpeed=1.00
; SimpleWhirl_RaiseOverride=Off
;
; Whirl_ReferenceHitBaseSpeed=0.90
; Whirl_BaseSpeed=1.00
; Whirl_RaiseOverride=Off
