; G3AnimationBehaviors behavior profiles
;
; Profile identity is defined by the four explicit identity fields. The text
; after "Profile." is only an author-facing label. Uncomment and adjust a
; complete section to configure it.
;
; BaseSpeed=<positive finite float>
;   Missing BaseSpeed preserves native speed behavior. BaseSpeed=1.00 is an
;   explicit configured value.
;
; Raise=Native|On
;   Native preserves Gothic's Raise behavior. On is reserved for the future
;   Raise feature and currently causes no Raise intervention.

; [Profile.Hero_None_1H_Normal]
; AnimationFamily=Hero
; LeftAnimationUseType=None
; RightAnimationUseType=1H
; ActionProfile=Normal
; BaseSpeed=0.80
; Raise=Native

; [Profile.Hero_None_1H_Quick]
; AnimationFamily=Hero
; LeftAnimationUseType=None
; RightAnimationUseType=1H
; ActionProfile=Quick
; BaseSpeed=1.00
; Raise=Native

; [Profile.Hero_Torch_1H_Normal]
; AnimationFamily=Hero
; LeftAnimationUseType=Torch
; RightAnimationUseType=1H
; ActionProfile=Normal
; BaseSpeed=0.85
; Raise=On
