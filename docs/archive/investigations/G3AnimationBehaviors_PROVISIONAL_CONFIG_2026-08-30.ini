; ============================================================================
; G3AnimationBehaviors.ini
; HISTORICAL / PROVISIONAL CONCEPTUAL TEMPLATE — EARLIER SCHEMA
; Date: 2026-08-30
; ============================================================================
;
; IMPORTANT:
; This preserves the earlier conceptual schema and its historical rationale.
; It is not the current shipping/canonical configuration or implementation contract.
; Historical examples below remain unchanged and may use superseded keys/shape.
; Current configuration understanding:
;   src/Script_G3AnimationBehaviors/Ini/G3AnimationBehaviors.ini
;   docs/DESIGN.md
;   docs/decisions/ADR-0008-grouped-loadout-profiles-expanded-attack-scope.md
;   docs/decisions/ADR-0009-sprint-inherits-power-speed-profile.md
;
; Runtime matching must use native engine semantics:
;   AnimationFamily
;   + normalized Left Animation UseType
;   + normalized Right Animation UseType
;   + exact gEAction mapped into a supported action profile
;
; Raw item gEUseType is NOT always the animation UseType:
;   Axe/Pickaxe -> 2H
;   Halberd/Rake/Shovel/Broom/Fan -> Staff
;   PhysicalFist -> Fist
;   See docs/ANIMATION_RULES.md for the full known mapping.
;
; Missing profile:
;   Leave Raise and speed behavior native/untouched.
;
; Collision:
;   NOT configured here.
;   Frame collision is opted into by reserved markers inside the exact
;   animation motion. The equipped-slot marker vocabulary is now frozen as:
;     G3AB_COL_RIGHT
;     G3AB_COL_LEFT
;     G3AB_COL_BOTH
;     G3AB_COL_OFF
;   RIGHT/LEFT mean equipped slots, not animation direction.
;   Fist/body source semantics remain separate and are not configured here.
;
; Recover:
;   No user-facing RecoverSpeed key is planned.
;   For a controlled profile, Recover should follow the effective Hit speed.
;
; ============================================================================
; PROVISIONAL PROFILE MODEL
; ============================================================================
;
; Conceptual key:
;   [<AnimationFamily>_<LeftAnimationUseType>_<RightAnimationUseType>_<ActionProfile>]
;
; User-facing ActionProfile may group exact native actions, but runtime code
; must still inspect the exact gEAction.
;
; Current intended minimum:
;   Normal -> gEAction_Attack
;   Quick  -> gEAction_QuickAttack / QuickAttackR / QuickAttackL
;
; Possible future profiles:
;   Power, SimpleWhirl, Whirl, Pierce, etc.
;
; ============================================================================
; KEYS
; ============================================================================
;
; Raise = Default | On | Off
;
;   Default:
;       Do not deliberately alter Raise behavior for this profile.
;
;   On:
;       Enable G3AnimationBehaviors Raise handling where a supported mechanism
;       exists.
;
;   Off:
;       Do not insert a custom Raise for this profile.
;       Active suppression of every possible native Raise case is NOT implied
;       unless the implementation explicitly supports it.
;
; Speed = <float>
;       Base controlled attack speed for supported phases.
;
; RaiseSpeed = <float>   ; optional
;       Override base Speed for Raise.
;
; HitSpeed = <float>     ; optional
;       Override base Speed for Hit.
;
; Numeric values below are EXAMPLES ONLY.
;
; ============================================================================
