; ============================================================================
; FRAME COLLISION
; ============================================================================
;
; Frozen equipped-slot marker vocabulary:
;   G3AB_COL_RIGHT
;   G3AB_COL_LEFT
;   G3AB_COL_BOTH
;   G3AB_COL_OFF
;
; Exact-set semantics:
;   RIGHT -> {RIGHT equipped slot}
;   LEFT  -> {LEFT equipped slot}
;   BOTH  -> {RIGHT, LEFT}
;   OFF   -> {}
;
; Collision marker timing remains animation-authored rather than INI-driven.
; Fist/body/monster source support must be proven separately before any wider
; source vocabulary or configuration is introduced.
; ============================================================================